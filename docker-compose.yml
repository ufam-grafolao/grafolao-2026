services:
  backend:
    build:
      context: ./apps/backend
    ports:
      - "3333:3333"
    env_file:
      - ./apps/backend/.env.docker
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "5173:5173"
    env_file:
      - ./apps/frontend/.env
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy