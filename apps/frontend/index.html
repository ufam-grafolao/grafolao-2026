<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bolão da Copa do Mundo 2026 com análise de grafos — UFAM ICC041" />
    <title>Grafolão</title>
    <script>
      // Aplica o tema antes da primeira pintura (mesma regra de src/lib/tema.ts)
      ;(function () {
        var salvo
        try { salvo = localStorage.getItem('theme') } catch (e) {}
        var escuro = salvo === 'dark' || (salvo !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (escuro) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
